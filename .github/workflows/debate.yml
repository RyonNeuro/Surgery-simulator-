name: AI 토론 (Claude vs ChatGPT)

# 실행 방법 (폰에서 가능)
#  1) 제목이 [토론] 으로 시작하는 이슈를 새로 만들거나
#  2) 아무 이슈에 /토론 이라고 댓글을 달면 실행됩니다.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: debate-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  debate:
    if: >
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[토론]')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/토론') &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 토론 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # 모델/라운드 수는 repo Settings → Secrets and variables → Actions → Variables 에서 바꿀 수 있음
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DEBATE_ROUNDS: ${{ vars.DEBATE_ROUNDS }}
        run: python scripts/debate.py
